[request_definition]
# Request (access request) definition.
# sub: subject (access principal. Assumes role string contained in JWT)
# obj: object (protected resource name. Example: users, groups, members, roles, etc.)
# act: action (operation type. Basic read/write values, mapped from HTTP methods)
#   - GET     -> read
#   - HEAD    -> read
#   - OPTIONS -> read
#   - POST    -> write
#   - PUT     -> write
#   - PATCH   -> write
#   - DELETE  -> write
r = sub, obj, act

[policy_definition]
# Policy (permission rule) definition.
# Format: p, sub, obj, act (one line = one rule).
# Example: p, admin, users, write -> admin role is allowed write (POST/PUT/DELETE, etc.) on users resource.
p = sub, obj, act

[role_definition]
# RBAC hierarchy definition (role inheritance).
# Format: g = user_role, parent_role.
# Example: Adding g, operator, user in policy.csv allows operator to inherit user permissions.
# Currently not using explicit inheritance, but enabled for future extension.
g = _, _

[policy_effect]
# Effect (aggregation when multiple matches) definition.
# some(where (p.eft == allow)) means "allow if at least one allow rule matches".
# Can customize here if using deny rules (e.g., priority model).
e = some(where (p.eft == allow))

[matchers]
# Matcher (request-to-policy matching) expression.
# r.sub == p.sub: Request subject's role matches policy role
# r.obj == p.obj: Resource name matches
# r.act == p.act: Action (read/write) matches
# Policy applies when all conditions match.
# For flexible resource path patterns (keyMatch), can change to:
#   m = r.sub == p.sub && keyMatch(r.obj, p.obj) && r.act == p.act
m = r.sub == p.sub && r.obj == p.obj && r.act == p.act
